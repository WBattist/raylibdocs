h+='<h2>'+(N[f.n]?'Example':'Usage')+'</h2><pre class="ex" id="ex">'+hl(N[f.n]?N[f.n].e:ex(f))+'</pre><p><button class="cp" style="position:static" data-c="e">Copy</button></p>';
h+='<h2>Related functions</h2><div class="chips">'+rel.map(x=>'<a href="#/functions/'+x.n+'">'+x.n+'</a>').join('')+'</div>';
h+='<div class="pn"><span>'+(prev?'<a href="#/functions/'+prev.n+'">← '+prev.n+'</a>':'')+'</span><span>'+(next?'<a href="#/functions/'+next.n+'">'+next.n+' →</a>':'')+'</span></div>';
main.innerHTML=h;main.querySelectorAll('.cp').forEach(b=>b.onclick=()=>cp(b.dataset.c=='d'?decl(f):(N[f.n]?N[f.n].e:ex(f)),b))}
function tyPage(t){const u=F.filter(f=>tyName(f.r)==t||f.p.some(p=>tyName(p[0])==t));
main.innerHTML=bc([['Types','#/index']])+'<h1 class="mono">'+t+'</h1><p style="font-size:18px">'+E(TY[t])+'</p>'+(D.x.tnote[t]?'<p>'+E(D.x.tnote[t])+'</p>':'')+(t=='Texture'?'<p>Also available as <code>Texture2D</code> and <code>TextureCubemap</code>.</p>':'')+(t=='RenderTexture'?'<p>Also available as <code>RenderTexture2D</code>.</p>':'')+(t=='Camera3D'?'<p>Also available as <code>Camera</code>.</p>':'')+(FD[t]?'<h2>Fields</h2><div class="tw"><table><tr><th>Name</th><th>Type</th><th>Description</th></tr>'+FD[t].map(r=>'<tr><td class="mono">'+r[1]+'</td><td class="mono">'+hl(r[0])+'</td><td>'+E(r[2])+'</td></tr>').join('')+'</table></div>':'')+'<h2>Functions using '+t+' ('+u.length+')</h2><div class="chips">'+u.map(f=>'<a href="#/functions/'+f.n+'">'+f.n+'</a>').join('')+'</div>'}
function modPage(m){main.innerHTML=bc([[m]])+'<h1 class="mono">'+m+'</h1><p>'+D.mods[m]+'</p>'+[...new Set(F.filter(f=>f.m==m).map(f=>f.c))].map(c=>'<h2>'+E(c)+'</h2><div class="chips">'+F.filter(f=>f.m==m&&f.c==c).map(f=>'<a href="#/functions/'+f.n+'" title="'+E(f.d)+'">'+f.n+'</a>').join('')+'</div>').join('')}
function home(){main.innerHTML='<h1>raylib v6.0 API reference</h1><p style="font-size:18px;max-width:60ch">'+F.length+' functions and '+Object.keys(TY).length+' types across '+ML.length+' modules. Search above, or start from a module.</p><div class="mods">'+ML.map(m=>'<a href="#/modules/'+m+'"><b class="mono">'+m+'</b>'+D.mods[m]+'<br><small>'+F.filter(f=>f.m==m).length+' functions</small></a>').join('')+'<a href="#/guides/cmake"><b>CMake setup</b>Build a raylib project, step by step</a><a href="#/enums"><b>Enums and flags</b>Config flags, keys, blend modes</a><a href="#/colors"><b>Colors</b>'+D.cols.length+' predefined colors</a><a href="#/index"><b>API index</b>Every function and type, A–Z</a></div><h2>Quick start</h2><pre class="ex">'+hl(N.InitWindow.e)+'</pre>'}
function idx(){const a=[...F].sort((x,y)=>x.n.localeCompare(y.n));main.innerHTML='<h1>API index</h1><h2>Types</h2><div class="li">'+Object.keys(TY).sort().map(t=>'<a class="mono" href="#/types/'+t+'">'+t+'</a>').join('')+'</div><h2>Functions</h2><div class="li">'+a.map(f=>'<a class="mono" href="#/functions/'+f.n+'">'+f.n+'</a>').join('')+'</div>'}
function colors(){main.innerHTML='<h1>Colors</h1><p>Predefined <code>Color</code> constants. Click to copy.</p><div class="sw">'+D.cols.map(c=>'<div><i style="background:rgba('+c[1]+','+c[2]+','+c[3]+','+c[4]/255+')"></i><span class="mono">'+c[0]+'<br>'+c[1]+', '+c[2]+', '+c[3]+', '+c[4]+'</span></div>').join('')+'</div>'}
const CB=[];const cbk=(t,lang)=>{CB.push(t);return '<pre class="ex" style="padding-right:80px;margin:10px 0">'+(lang=='c'?hl(t):E(t))+'<button class="cp" data-i="'+(CB.length-1)+'">Copy</button></pre>'};
const wire=()=>main.querySelectorAll('button.cp[data-i]').forEach(b=>b.onclick=()=>cp(CB[b.dataset.i],b));
function enums(){main.innerHTML='<h1>Enums and flags</h1><p style="max-width:70ch">Common constants from <code>raylib.h</code>. These are written from memory of the 5.x headers, so check the header for the full lists and any 6.0 changes.</p>'+D.x.enums.map(g=>'<h2>'+g[0]+'</h2><p>'+E(g[1])+'</p><div class="tw"><table><tr><th>Name</th><th>Value</th><th>Description</th></tr>'+g[2].map(r=>'<tr><td class="mono">'+r[0]+'</td><td class="mono">'+r[1]+'</td><td>'+E(r[2])+'</td></tr>').join('')+'</table></div>').join('')}
function cmake(){CB.length=0;
const cml=`cmake_minimum_required(VERSION 3.14)
project(MyRaylibGame CXX) # Change to C if you are using standard C

# 1. Enforce standard language versions
set(CMAKE_CXX_STANDARD 17)
set(CMAKE_CXX_STANDARD_REQUIRED ON)

# 2. Include FetchContent module
include(FetchContent)

# 3. Optimize raylib compilation settings (avoids compiling unneeded files)
set(BUILD_EXAMPLES OFF CACHE BOOL "" FORCE)
set(BUILD_GAMES OFF CACHE BOOL "" FORCE)

# 4. Declare raylib dependency from the official GitHub repo
FetchContent_Declare(
    raylib
    GIT_REPOSITORY "https://github.com/raysan5/raylib.git"
    GIT_TAG        "master" # Or target a specific version like "5.0"
)

# 5. Download and make the dependency available to the build
FetchContent_MakeAvailable(raylib)

# 6. Define your game's executable target and source files
add_executable(\${PROJECT_NAME} main.cpp)

# 7. Link raylib directly to your executable target
target_link_libraries(\${PROJECT_NAME} PRIVATE raylib)`;
const mc=`#include "raylib.h"

int main()
{
    InitWindow(800, 450, "MyRaylibGame");
    SetTargetFPS(60);

    while (!WindowShouldClose())
    {
        BeginDrawing();
            ClearBackground(RAYWHITE);
            DrawText("CMake + raylib works!", 190, 200, 20, DARKGRAY);
        EndDrawing();
    }

    CloseWindow();
    return 0;
}`;
const steps=[['Language standard','Requests C++17 and makes it mandatory. For a C project, change <code>CXX</code> to <code>C</code> in <code>project()</code> and drop these two lines.'],['FetchContent','Loads the module that downloads dependencies at configure time.'],['Build options','Turns off raylib\'s examples and games so only the library is compiled. Setting them before <code>FetchContent_MakeAvailable</code> is what makes them take effect.'],['FetchContent_Declare','Says where raylib comes from. <code>GIT_TAG</code> picks a branch, tag or commit. <code>master</code> changes over time, so pin a release tag for repeatable builds.'],['FetchContent_MakeAvailable','Downloads raylib on the first configure and adds it to your build as a subproject. Later configures reuse the download.'],['add_executable','Creates your program from <code>main.cpp</code>. List more source files here as the game grows.'],['target_link_libraries','Links the <code>raylib</code> target. It carries the include paths and the system libraries it needs, so no manual flags are required. <code>PRIVATE</code> is right for an executable.']];
main.innerHTML=bc([['Guides'],['CMake setup']])+'<h1>Set up a raylib project with CMake</h1><p style="max-width:70ch;font-size:18px">This guide builds a window on Windows, macOS or Linux. CMake downloads and compiles raylib for you, so you do not install raylib separately.</p>'+
'<h2>Before you start</h2><ul><li><b>CMake</b> 3.14 or newer, and a C/C++ compiler (GCC, Clang or MSVC).</li><li><b>Git</b>, because FetchContent clones the raylib repository.</li><li><b>Linux only:</b> the X11/OpenGL development packages. On Debian or Ubuntu: <code>sudo apt install build-essential git cmake libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev</code></li><li><b>macOS:</b> the Xcode command line tools (<code>xcode-select --install</code>).</li></ul>'+
'<h2>Project layout</h2>'+cbk('MyRaylibGame/\n├── CMakeLists.txt\n└── main.cpp','')+
'<h2>CMakeLists.txt</h2>'+cbk(cml,'')+'<p>The minimum version here is 3.14, not 3.12. <code>FetchContent_MakeAvailable</code> was added in CMake 3.14, so a lower minimum would claim support the file does not have. If configuring fails on a version check inside raylib, raise it further.</p>'+
'<h2>What each step does</h2><div class="tw"><table><tr><th>Step</th><th>Purpose</th></tr>'+steps.map((s,i)=>'<tr><td><b>'+(i+1)+'. '+s[0]+'</b></td><td>'+s[1]+'</td></tr>').join('')+'</table></div>'+
'<h2>main.cpp</h2>'+cbk(mc,'c')+'<p>Raylib\'s API is plain C, so it works from C++ unchanged. One catch: examples elsewhere in this reference use C compound literals like <code>(Vector2){ 10, 20 }</code>. That syntax is a GCC/Clang extension in C++ and fails on MSVC. In C++ write <code>Vector2{ 10, 20 }</code> instead.</p>'+
'<h2>Configure, build, run</h2>'+cbk('cmake -S . -B build\ncmake --build build --config Release\n\n# Linux / macOS\n./build/MyRaylibGame\n\n# Windows (Visual Studio generator)\nbuild\\Release\\MyRaylibGame.exe','')+'<p>The first configure clones and compiles raylib, which takes a minute. Later builds only recompile your code.</p>'+
'<h2>Common additions</h2><h3>Pin a release</h3>'+cbk('GIT_TAG        "5.5"\nGIT_SHALLOW    TRUE   # download only that tag, much faster','')+'<p>Use a tag that exists in the raylib repository; check its Releases page for the one that matches the version you want.</p>'+
'<h3>Use an installed raylib if one exists</h3>'+cbk('FetchContent_Declare(\n    raylib\n    GIT_REPOSITORY "https://github.com/raysan5/raylib.git"\n    GIT_TAG        "5.5"\n    FIND_PACKAGE_ARGS NAMES raylib\n)','')+'<p>Needs CMake 3.24 or newer. It tries <code>find_package(raylib)</code> first and only downloads when nothing is found.</p>'+
'<h3>Ship assets next to the executable</h3>'+cbk('add_custom_command(TARGET ${PROJECT_NAME} POST_BUILD\n    COMMAND ${CMAKE_COMMAND} -E copy_directory\n            ${CMAKE_SOURCE_DIR}/resources $<TARGET_FILE_DIR:${PROJECT_NAME}>/resources)','')+'<p>Raylib loads files like <code>"resources/player.png"</code> relative to the working directory, so the folder has to be where the program runs.</p>'+
'<h3>More source files</h3>'+cbk('add_executable(${PROJECT_NAME} main.cpp game.cpp player.cpp)\n# or: file(GLOB SRC CONFIGURE_DEPENDS src/*.cpp)','')+
'<h2>Troubleshooting</h2><ul><li><b>Linux: "cannot find -lX11" or missing GL headers:</b> install the packages from the list above.</li><li><b>Configure fails while downloading:</b> check that Git works and the machine can reach github.com.</li><li><b>Window opens then closes:</b> the loop ended. Make sure <code>WindowShouldClose()</code> is the loop condition and ESC was not pressed.</li><li><b>Textures are not found:</b> the working directory is not your project folder; see the assets step.</li></ul>'+
'<p>Next: see <a href="#/functions/InitWindow">InitWindow</a> and <a href="#/functions/BeginDrawing">BeginDrawing</a> for what the program above calls.</p>';wire()}

function route(){const p=(location.hash||'#/').slice(2).split('/');const k=p[0],v=decodeURIComponent(p[1]||'');let t='raylib v6.0 API reference';
if(k=='functions'&&FM[v]){fnPage(FM[v]);t=v+' · raylib'}else if(k=='types'&&TY[v]){tyPage(v);t=v+' · raylib'}else if(k=='modules'&&D.mods[v])modPage(v);else if(k=='colors')colors();else if(k=='enums')enums();else if(k=='guides'&&v=='cmake'){cmake();t='CMake setup · raylib'}else if(k=='index')idx();else home();
document.title=t;window.scrollTo(0,0);document.body.classList.remove('o');
document.querySelectorAll('#nav a.act').forEach(a=>a.classList.remove('act'));const a=document.querySelector('#nav a[href="#/'+k+'/'+v+'"]');if(a){a.classList.add('act');let d=a.parentElement;while(d&&d.tagName=='DETAILS'){d.open=true;d=d.parentElement}a.scrollIntoView({block:'nearest'})}}
addEventListener('hashchange',route);route();
// search
const q=document.getElementById('q'),res=document.getElementById('res');let sel=-1,items=[];
function srch(){const s=q.value.trim().toLowerCase();if(!s){res.style.display='none';return}
const all=[...F.map(f=>({k:'functions',n:f.n,d:f.d})),...Object.keys(TY).map(t=>({k:'types',n:t,d:TY[t]}))];
items=all.map(x=>{const n=x.n.toLowerCase();const sc=n==s?0:n.startsWith(s)?1:n.includes(s)?2:x.d.toLowerCase().includes(s)?3:9;return[sc,x]}).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]||a[1].n.localeCompare(b[1].n)).slice(0,40).map(x=>x[1]);sel=-1;
res.innerHTML=items.length?items.map((x,i)=>'<a href="#/'+x.k+'/'+x.n+'"><span class="mono">'+x.n+'</span>'+(x.k=='types'?' <small>type</small>':'')+'<small>'+E(x.d)+'</small></a>').join(''):'<a><small>No matches. Try a shorter term.</small></a>';res.style.display='block'}
q.oninput=srch;q.onfocus=srch;
q.onkeydown=e=>{const as=[...res.querySelectorAll('a[href]')];if(e.key=='ArrowDown'||e.key=='ArrowUp'){e.preventDefault();sel=Math.max(0,Math.min(as.length-1,sel+(e.key=='ArrowDown'?1:-1)));as.forEach((a,i)=>a.classList.toggle('on',i==sel));as[sel]&&as[sel].scrollIntoView({block:'nearest'})}else if(e.key=='Enter'&&as.length){location.hash=as[Math.max(sel,0)].getAttribute('href');q.blur();res.style.display='none'}else if(e.key=='Escape'){res.style.display='none';q.blur()}};
res.onclick=()=>{res.style.display='none';q.value=''};
document.addEventListener('keydown',e=>{if(e.key=='/'&&document.activeElement!=q){e.preventDefault();q.focus()}});
document.addEventListener('click',e=>{if(!document.getElementById('sw').contains(e.target))res.style.display='none'});
document.getElementById('menu').onclick=()=>document.body.classList.toggle('o');
const r=document.documentElement,th=document.getElementById('th');
try{const s=localStorage.getItem('rl-theme');if(s)r.dataset.theme=s}catch(e){}
